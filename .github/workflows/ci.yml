name: Verificación BLACKBOX AI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blackbox-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BLACKBOX_ENVIRONMENT: test
      BLACKBOX_AI_PROVIDER: disabled
      BLACKBOX_AI_API_KEY: ""
      BLACKBOX_AI_MODEL: ""
      BLACKBOX_LOCAL_LAB_ENABLED: "false"
      BLACKBOX_LOCAL_LAB_ALLOWED_ORIGINS: "[]"
      BLACKBOX_DEMO_TESTING_ENABLED: "false"
      BLACKBOX_DATABASE_URL: sqlite:///./data/ci-migrations.db
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tools/browsers
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.16"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dependencias fijadas y Chromium
        run: |
          python -m venv backend/.venv
          echo "$GITHUB_WORKSPACE/backend/.venv/bin" >> "$GITHUB_PATH"
          backend/.venv/bin/python -m pip install --require-hashes -r backend/requirements-dev.lock
          backend/.venv/bin/python -m pip check
          backend/.venv/bin/python -m playwright install --with-deps chromium --only-shell
          npm ci --prefix frontend
      - name: Migraciones
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m alembic check
      - name: Backend e integración real con Chromium
        run: |
          mkdir -p .tools/ci
          python -m pytest backend/tests --junitxml=.tools/ci/pytest.xml
      - name: Frontend e integración del cliente
        run: |
          npm --prefix frontend run test:integration
          npm --prefix frontend run build
      - name: Demo CLI con base independiente
        working-directory: backend
        env:
          BLACKBOX_DEMO_TESTING_ENABLED: "true"
        run: python -m app.cli demo --standalone --database ../.tools/ci/cli.db --authorize --json ../.tools/ci/cli-results.json
      - name: Resultados sintéticos de verificación
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verification-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            .tools/ci/pytest.xml
            .tools/ci/cli-results.json
